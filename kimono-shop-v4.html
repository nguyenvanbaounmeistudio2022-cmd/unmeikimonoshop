<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>和 Kimono Shop — Kimono Nhật Bản Chính Hãng</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Georgia',serif; background:#faf8f5; color:#2d2d2d; }

header {
  background:#1a1a2e; color:#f0e6d3;
  padding:0 40px; display:flex; align-items:center;
  justify-content:space-between; height:70px;
  position:sticky; top:0; z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
}
.logo { font-size:22px; letter-spacing:3px; font-style:italic; }
.logo span { color:#c9a96e; }
.header-right { display:flex; align-items:center; gap:4px; }
.nav-btn {
  background:transparent; border:none; color:#f0e6d3;
  font-size:13px; letter-spacing:1px; font-family:Arial,sans-serif;
  padding:0 16px; height:70px; cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;
  white-space:nowrap;
}
.nav-btn:hover { color:#c9a96e; }
.nav-btn.active { color:#c9a96e; border-bottom-color:#c9a96e; }
.cart-btn {
  background:transparent; border:none; color:#f0e6d3;
  cursor:pointer; font-size:13px; font-family:Arial,sans-serif;
  display:flex; align-items:center; gap:6px; padding:0 12px; height:70px;
}
.cart-dot {
  background:#c9a96e; color:#1a1a2e; border-radius:50%;
  width:18px; height:18px; font-size:11px; font-weight:bold;
  display:none; align-items:center; justify-content:center;
}
.lock-btn { background:transparent; border:none; cursor:pointer; font-size:18px; padding:0 8px; }

.hero {
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#2d1b3d 100%);
  color:white; text-align:center; padding:80px 40px;
  position:relative; overflow:hidden;
}
.hero::before { content:'着物'; position:absolute; font-size:300px; opacity:0.05; right:-40px; top:-60px; pointer-events:none; }
.hero h1 { font-size:48px; margin-bottom:16px; font-style:italic; color:#f0e6d3; }
.hero p { font-size:18px; color:#c9a96e; margin-bottom:32px; letter-spacing:2px; font-family:Arial,sans-serif; }
.hero-btn {
  background:#c9a96e; color:#1a1a2e; padding:14px 40px; border:none;
  font-size:15px; cursor:pointer; letter-spacing:2px;
  font-family:Arial,sans-serif; font-weight:bold; display:inline-block;
}
.hero-btn:hover { background:#e8c88a; }

.rate-bar {
  background:#f0ebe3; border-bottom:1px solid #e8e0d5;
  padding:10px 40px; display:flex; align-items:center;
  gap:10px; font-size:13px; font-family:Arial,sans-serif; color:#666;
}
.rate-bar input { width:80px; padding:4px 8px; border:1px solid #d4c9b8; font-size:13px; }

.filter-bar {
  background:white; border-bottom:1px solid #e8e0d5;
  padding:14px 40px; display:flex; gap:10px; align-items:center;
  flex-wrap:wrap; position:sticky; top:70px; z-index:40;
}
.filter-bar span { font-size:13px; color:#888; font-family:Arial,sans-serif; }
.filter-btn {
  background:white; border:1px solid #d4c9b8; padding:7px 18px;
  font-size:13px; cursor:pointer; font-family:Arial,sans-serif;
  transition:all 0.2s;
}
.filter-btn:hover,.filter-btn.active { background:#1a1a2e; color:white; border-color:#1a1a2e; }
.search-inp {
  margin-left:auto; padding:7px 14px; border:1px solid #d4c9b8;
  font-size:13px; font-family:Arial,sans-serif; width:200px;
}

.stats-bar {
  display:flex; background:white; border-bottom:1px solid #e8e0d5;
  overflow-x:auto;
}
.stat-item {
  flex:1; min-width:90px; text-align:center; padding:12px 8px;
  border-right:1px solid #e8e0d5; font-family:Arial,sans-serif;
}
.stat-item:last-child { border-right:none; }
.stat-item .val { font-size:16px; font-weight:bold; color:#1a1a2e; }
.stat-item .val.ok { color:#2d7a50; }
.stat-item .val.gold { color:#c9a96e; }
.stat-item .lbl { font-size:11px; color:#888; margin-top:2px; }

.section-title { text-align:center; padding:48px 40px 32px; }
.section-title h2 { font-size:32px; color:#1a1a2e; margin-bottom:8px; }
.section-title p { color:#888; font-family:Arial,sans-serif; font-size:14px; }

.cat-header {
  font-size:22px; color:#1a1a2e; padding:24px 40px 14px;
  border-bottom:2px solid #c9a96e; margin:0 40px 20px;
  font-style:italic; display:flex; align-items:baseline; gap:10px;
}
.cat-header span { font-size:13px; color:#888; font-family:Arial,sans-serif; font-style:normal; }

.products {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:32px; padding:0 40px 60px; max-width:1300px; margin:0 auto;
}
.product-card {
  background:white; border:1px solid #e8e0d5;
  transition:transform 0.2s,box-shadow 0.2s; cursor:pointer;
}
.product-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,0.1); }
.product-card.unavail { opacity:0.65; }
.product-img {
  aspect-ratio:9/16; background:#f0ebe3; position:relative;
  overflow:hidden; display:flex; align-items:center; justify-content:center;
}
.product-img img { width:100%; height:100%; object-fit:contain; position:absolute; inset:0; background:#f0ebe3; }
.product-img .ph { font-size:70px; position:relative; z-index:1; }
.product-img .kanji { position:absolute; font-size:120px; opacity:0.08; color:#1a1a2e; }
.ribbon {
  position:absolute; top:10px; left:0; z-index:2;
  color:white; font-size:11px; padding:4px 12px;
  font-family:Arial,sans-serif; letter-spacing:1px;
}
.ribbon.sold { background:#c0392b; }
.ribbon.reserved { background:#b37a00; }
.img-count {
  position:absolute; bottom:8px; right:8px;
  background:rgba(26,26,46,0.75); color:white;
  font-size:11px; padding:3px 8px; border-radius:10px;
  font-family:Arial,sans-serif; z-index:2;
}
.product-info { padding:20px; border-top:1px solid #f0ebe3; }
.product-cat { font-size:11px; color:#c9a96e; letter-spacing:1px; font-family:Arial,sans-serif; text-transform:uppercase; }
.product-code { font-size:11px; color:#c9a96e; font-family:Arial,sans-serif; font-weight:bold; }
.product-name { font-size:17px; color:#1a1a2e; margin:4px 0 6px; }
.product-desc { font-size:13px; color:#888; font-family:Arial,sans-serif; margin-bottom:12px; line-height:1.5; }
.product-footer { display:flex; align-items:center; justify-content:space-between; }
.price { font-size:20px; color:#c9a96e; font-weight:bold; }
.price-jpy { font-size:12px; color:#aaa; font-family:Arial,sans-serif; }
.add-btn {
  background:#1a1a2e; color:white; border:none;
  padding:10px 18px; font-size:12px; cursor:pointer;
  font-family:Arial,sans-serif; letter-spacing:1px; transition:background 0.15s;
}
.add-btn:hover { background:#2d2d4e; }
.add-btn.in-cart { background:#2d7a50; }
.add-btn:disabled { background:#ccc; cursor:not-allowed; }

.empty-state { text-align:center; padding:80px 40px; color:#888; font-family:Arial,sans-serif; }
.empty-state .icon { font-size:48px; margin-bottom:16px; }

.banner {
  background:#1a1a2e; color:#f0e6d3; text-align:center;
  padding:48px 40px; margin:20px 40px;
}
.banner h3 { font-size:26px; margin-bottom:12px; font-style:italic; }
.banner p { font-family:Arial,sans-serif; font-size:14px; color:#c9a96e; letter-spacing:2px; }

.info-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:1px; background:#e8e0d5;
}
.info-box { background:white; padding:32px 24px; text-align:center; }
.info-icon { font-size:32px; margin-bottom:12px; }
.info-box h4 { font-size:15px; color:#1a1a2e; margin-bottom:8px; }
.info-box p { font-size:13px; color:#888; font-family:Arial,sans-serif; line-height:1.6; }

footer {
  background:#1a1a2e; color:#a0a0b8; text-align:center;
  padding:32px; font-family:Arial,sans-serif; font-size:13px;
}
footer a { color:#c9a96e; text-decoration:none; margin:0 12px; }
.logo-ft { font-size:18px; color:#f0e6d3; font-style:italic; margin-bottom:12px; }

/* OVERLAY / MODAL */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7);
  display:flex; align-items:flex-end; justify-content:center; z-index:200;
}
@media(min-width:600px){ .overlay { align-items:center; } }
.sheet {
  background:white; width:100%; max-width:540px;
  max-height:92vh; overflow-y:auto;
  border-radius:12px 12px 0 0; padding-bottom:24px;
}
@media(min-width:600px){ .sheet { border-radius:12px; margin:20px; } }
.sheet-head {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 20px; border-bottom:1px solid #e8e0d5;
  position:sticky; top:0; background:white; z-index:5;
}
.sheet-head h3 { margin:0; font-size:18px; color:#1a1a2e; }
.close-x { background:none; border:none; font-size:22px; color:#999; cursor:pointer; padding:4px 8px; }
.carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background:#1a1a2e; }
.carousel img { width:100%; flex:0 0 100%; scroll-snap-align:start; aspect-ratio:3/4; object-fit:contain; }
.sheet-body { padding:20px; }
.detail-price { text-align:center; padding:16px; margin:12px 0; background:#faf8f5; border:1px solid #e8e0d5; }
.detail-price .vnd { font-size:28px; font-weight:bold; color:#c9a96e; }
.detail-price .jpy { font-size:13px; color:#888; font-family:Arial,sans-serif; }
.detail-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0ebe3; font-size:14px; }
.detail-row span:first-child { color:#888; font-family:Arial,sans-serif; }
.detail-row span:last-child { font-weight:600; }
.status-row { display:flex; gap:8px; margin-top:12px; }
.status-btn { flex:1; padding:8px; border:1px solid #d4c9b8; background:white; cursor:pointer; font-size:12px; font-family:Arial,sans-serif; }
.status-btn.s-ok { background:#2d7a50; color:white; border-color:#2d7a50; }
.status-btn.s-gold { background:#c9a96e; color:white; border-color:#c9a96e; }
.status-btn.s-red { background:#c0392b; color:white; border-color:#c0392b; }
.sheet-actions { display:flex; gap:10px; margin-top:16px; }
.sheet-actions button { flex:1; }
.btn-primary { background:#1a1a2e; color:white; border:none; padding:12px 20px; font-size:14px; cursor:pointer; font-family:Arial,sans-serif; letter-spacing:1px; }
.btn-primary:hover { background:#2d2d4e; }
.btn-primary.green { background:#2d7a50; }
.btn-primary.red { background:#c0392b; }
.btn-secondary { background:white; border:1px solid #d4c9b8; color:#1a1a2e; padding:12px 20px; font-size:14px; cursor:pointer; font-family:Arial,sans-serif; }
button:disabled { opacity:0.5; cursor:not-allowed; }

/* ADMIN */
.admin-wrap { padding:32px 40px; max-width:800px; margin:0 auto; }
.admin-wrap h2 { font-size:26px; color:#1a1a2e; margin-bottom:24px; font-style:italic; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:11px; font-weight:bold; color:#888; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; font-family:Arial,sans-serif; }
.field input,.field textarea,.field select { width:100%; padding:10px 12px; border:1px solid #d4c9b8; font-size:14px; font-family:Arial,sans-serif; color:#1a1a2e; background:white; }
.field textarea { resize:vertical; min-height:80px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.upload-box { border:2px dashed #d4c9b8; padding:20px; text-align:center; color:#888; cursor:pointer; font-family:Arial,sans-serif; font-size:13px; margin-bottom:12px; background:#faf8f5; }
.upload-box:hover { border-color:#c9a96e; color:#c9a96e; }
.upload-box.dis { opacity:0.4; cursor:not-allowed; }
.thumbs-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.thumb-slot { width:90px; height:112px; position:relative; border:1px solid #e8e0d5; overflow:hidden; background:#f0ebe3; }
.thumb-slot img { width:100%; height:100%; object-fit:cover; }
.thumb-rm { position:absolute; top:3px; right:3px; background:rgba(26,26,46,0.8); color:white; border:none; width:20px; height:20px; font-size:12px; cursor:pointer; border-radius:50%; line-height:1; }
.hint { font-size:12px; color:#aaa; margin:-8px 0 12px; font-family:Arial,sans-serif; }

/* MANAGE */
.mg-table { border:1px solid #e8e0d5; background:white; margin-bottom:16px; }
.mg-row { display:grid; grid-template-columns:32px 44px 1fr 100px 120px; gap:8px; padding:8px 12px; border-bottom:1px solid #f0ebe3; align-items:center; }
.mg-row:last-child { border-bottom:none; }
.mg-head { background:#f0ebe3; font-size:11px; font-weight:bold; color:#888; text-transform:uppercase; letter-spacing:1px; font-family:Arial,sans-serif; }
.mg-thumb { width:44px; height:55px; object-fit:cover; background:#f0ebe3; }
.mg-info .code { font-size:11px; color:#c9a96e; font-weight:bold; }
.mg-info .name { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mg-price { width:100%; padding:6px 8px; font-size:13px; border:1px solid #d4c9b8; }
.mg-status { width:100%; padding:5px 4px; font-size:12px; border:1px solid #d4c9b8; }
.reorder { display:flex; flex-direction:column; gap:2px; }
.reorder button { background:#f0ebe3; border:none; font-size:10px; padding:2px 5px; cursor:pointer; color:#666; }

/* CART */
.cart-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #f0ebe3; align-items:center; }
.cart-item img { width:56px; height:70px; object-fit:cover; background:#f0ebe3; flex-shrink:0; }
.cart-item .ci-info { flex:1; min-width:0; }
.cart-item .ci-code { font-size:11px; color:#c9a96e; font-weight:bold; font-family:Arial,sans-serif; }
.cart-item .ci-name { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cart-item .ci-price { font-size:14px; font-weight:bold; color:#1a1a2e; }
.cart-item .ci-rm { background:none; border:none; color:#ccc; font-size:18px; cursor:pointer; }
.cart-total { background:#1a1a2e; color:white; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
.cart-total .lbl { font-size:12px; color:#9AA5BD; font-family:Arial,sans-serif; }
.cart-total .val { font-size:22px; font-weight:bold; }
.checkout-line { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #f0ebe3; font-family:Arial,sans-serif; }
.checkout-line.total { border-top:2px solid #1a1a2e; border-bottom:none; font-weight:bold; font-size:16px; margin-top:8px; padding-top:12px; }
.bank-box { background:#faf8f5; border:1px solid #e8e0d5; padding:16px; text-align:center; margin:16px 0; }
.bank-box img { width:160px; margin-bottom:10px; }
.bank-box .bname { font-weight:bold; font-size:15px; color:#1a1a2e; }
.bank-box .bnum { font-size:20px; font-weight:bold; color:#c9a96e; margin:4px 0; }
.bank-box .bbank { font-size:12px; color:#888; font-family:Arial,sans-serif; }

.toast-el { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1a2e; color:white; padding:12px 24px; font-family:Arial,sans-serif; font-size:14px; z-index:999; border-left:4px solid #c9a96e; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; }
.spinner.dark { border-color:rgba(26,26,46,0.2); border-top-color:#1a1a2e; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-center { text-align:center; padding:60px; color:#888; font-family:Arial,sans-serif; }

.info-banner { background:#FBF3E3; border:1px solid #c9a96e; color:#1a1a2e; padding:12px 16px; font-size:13px; font-family:Arial,sans-serif; margin-bottom:16px; line-height:1.5; }
.settings-box { background:#faf8f5; border:1px solid #e8e0d5; padding:20px; margin-bottom:20px; }
.settings-box h4 { font-size:16px; color:#1a1a2e; margin-bottom:14px; }

@media(max-width:600px){
  header { padding:0 16px; }
  .nav-btn { padding:0 8px; font-size:11px; }
  .hero { padding:50px 20px; }
  .hero h1 { font-size:28px; }
  .hero p { font-size:14px; }
  .filter-bar { padding:12px 16px; top:60px; }
  .search-inp { width:100%; margin-left:0; margin-top:4px; }
  .products { padding:0 16px 40px; gap:16px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  /* product-img uses aspect-ratio */
  .cat-header { margin:0 16px 16px; padding:20px 0 10px; }
  .banner { margin:16px; padding:32px 20px; }
  .admin-wrap { padding:16px; }
  .row2 { grid-template-columns:1fr; }
  .rate-bar { padding:10px 16px; }
}
</style>
</head>

<header>

  <div class="header-right">

    <button class="lock-btn" id="lockBtn">🔒</button>

</header>

// ═══ LOCALSTORAGE STORAGE (thay thế Firebase) ═══
const LS_INDEX = 'kimono_index';
const LS_SETTINGS = 'kimono_settings';
const LS_ITEM_PREFIX = 'kimono_item_';

async function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    if(raw) state.settings = {...state.settings, ...JSON.parse(raw)};
  }catch(e){}
}
async function saveSettings(){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings)); }catch(e){ toast('Lỗi lưu cài đặt'); }
}
async function loadIndex(){
  try{
    const raw = localStorage.getItem(LS_INDEX);
    if(raw) state.index = JSON.parse(raw);
  }catch(e){ state.index = []; }
}
async function saveIndex(){
  try{ localStorage.setItem(LS_INDEX, JSON.stringify(state.index)); }catch(e){ toast('Lỗi lưu danh mục'); throw e; }
}
async function loadItem(id){
  // Check memory cache first
  if(state.itemCache[id]) return state.itemCache[id];
  // Check localStorage
  try{
    const raw = localStorage.getItem(LS_ITEM_PREFIX + id);
    if(raw){ const obj = JSON.parse(raw); state.itemCache[id] = obj; return obj; }
  }catch(e){}
  // Fallback: find in SEED_ITEMS
  const seed = SEED_ITEMS.find(x => x.id === id);
  if(seed){ state.itemCache[id] = seed; return seed; }
  return null;
}
async function saveItem(item){
  try{ localStorage.setItem(LS_ITEM_PREFIX + item.id, JSON.stringify(item)); }catch(e){ throw new Error('localStorage đầy — xoá bớt mẫu cũ'); }
  state.itemCache[item.id] = item;
}
async function deleteItemDB(id){
  try{ localStorage.removeItem(LS_ITEM_PREFIX + id); }catch(e){}
  delete state.itemCache[id];
}

function compressImage(file,maxDim,q){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onerror=()=>rej(new Error('read fail'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('decode fail'));
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
        else if(h>w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showPin(cb){
  const hasPin=!!state.settings.adminPin;
  mroot.innerHTML=`<div class="overlay" id="pinO"><div class="sheet" style="max-width:360px;"><div class="sheet-head"><h3>${hasPin?'Nhập mã quản trị':'Tạo mã quản trị'}</h3><button class="close-x" id="pinX">✕</button></div><div class="sheet-body">${!hasPin?'<p style="font-size:13px;color:#888;font-family:Arial,sans-serif;margin-bottom:14px;">Lần đầu — tạo mã để bảo vệ trang quản lý.</p>':''}<div class="field"><label>${hasPin?'Mã':'Mã mới'}</label><input type="password" id="pinIn" placeholder="••••" autocomplete="off"></div><button class="btn-primary" id="pinOk" style="width:100%">${hasPin?'Xác nhận':'Tạo mã'}</button></div></div></div>`;
  document.getElementById('pinO').addEventListener('click',e=>{ if(e.target.id==='pinO') mroot.innerHTML=''; });
  document.getElementById('pinX').addEventListener('click',()=>mroot.innerHTML='');
  const go=async()=>{
    const v=document.getElementById('pinIn').value.trim(); if(!v){ toast('Nhập mã'); return; }
    if(!hasPin){ state.settings.adminPin=v; try{await saveSettings();}catch(e){} state.unlocked=true; document.getElementById('lockBtn').textContent='🔓'; mroot.innerHTML=''; toast('Đã tạo mã'); cb(); }
    else if(v===state.settings.adminPin){ state.unlocked=true; document.getElementById('lockBtn').textContent='🔓'; mroot.innerHTML=''; cb(); }
    else toast('Sai mã');
  };
  document.getElementById('pinOk').addEventListener('click',go);
  document.getElementById('pinIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  setTimeout(()=>{ const el=document.getElementById('pinIn'); if(el) el.focus(); },100);
}

function render(){
  if(!state.loaded){ root.innerHTML='<div class="loading-center"><div class="spinner dark"></div><p style="margin-top:12px;">Đang tải…</p></div>'; return; }
  if(state.tab==='shop') renderShop();
  else if(state.tab==='form') renderForm();
  else if(state.tab==='manage') renderManage();
  else if(state.tab==='cart') renderCart();
}

  let filtered=state.index.filter(it=>{
    if(!state.shopShowUnavail&&(it.status||'available')!=='available') return false;
    if(state.shopCat!=='all'&&(it.category||'Khác')!==state.shopCat) return false;
    if(state.shopSearch){ const q=state.shopSearch.toLowerCase(); if(!(it.code||'').toLowerCase().includes(q)&&!(it.name||'').toLowerCase().includes(q)) return false; }

      gridHtml=`<div class="products">${filtered.map(shopCard).join('')}</div>`;

  root.innerHTML=`

    <p>✦ HÀNG NHẬP KHẨU TRỰC TIẾP TỪ NHẬT BẢN ✦</p>

    <div class="stat-item"><div class="val gold" style="font-size:13px">${fmtVND(totalVal)}</div><div class="lbl">Giá trị còn</div></div>
  </div>
  <div class="rate-bar">Tỷ giá: 1 JPY = <input type="number" id="rateIn" value="${state.settings.exchangeRate}" step="0.1"> VND &nbsp;|&nbsp; <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:Arial,sans-serif;"><input type="checkbox" id="showUnavail" ${state.shopShowUnavail?'checked':''}> Hiện cả đã bán</label></div>
  <div class="filter-bar" id="products">
    <span>Lọc:</span>
    <button class="filter-btn ${state.shopCat==='all'?'active':''}" data-cat="all">Tất cả</button>
    ${CATS.map(c=>`<button class="filter-btn ${state.shopCat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}

      <button class="status-btn ${status==='available'?'s-ok':''}" data-s="available">Còn hàng</button>

      <button class="status-btn ${status==='sold'?'s-red':''}" data-s="sold">Đã bán</button>
    </div></div>
    <div class="sheet-actions"><button class="btn-secondary" id="detEdit">✏️ Sửa</button><button class="btn-primary red" id="detDel">Xoá</button></div>`;
  document.getElementById('detCart').addEventListener('click',()=>{ state.cart[id]=!state.cart[id]; updateCartBadge(); openDetail(id); if(state.tab==='shop') renderShop(); });
  document.querySelectorAll('.status-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ requireAdmin(async()=>{ meta.status=btn.dataset.s; if(meta.status!=='available') delete state.cart[id]; await saveIndex(); openDetail(id); if(state.tab==='shop') renderShop(); }); }); });
  document.getElementById('detEdit').addEventListener('click',()=>{ requireAdmin(()=>{ mroot.innerHTML=''; startEdit(id); }); });
  document.getElementById('detDel').addEventListener('click',()=>{ requireAdmin(()=>{ confirmModal(`Xoá mẫu "${meta.code||meta.name}"?`,async()=>{ state.index=state.index.filter(x=>x.id!==id); await saveIndex(); await deleteItemDB(id); delete state.cart[id]; updateCartBadge(); toast('Đã xoá'); mroot.innerHTML=''; render(); }); }); });

function confirmModal(msg,onYes){

  document.getElementById('cfO').addEventListener('click',e=>{ if(e.target.id==='cfO') mroot.innerHTML=''; });
  document.getElementById('cfX').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('cfNo').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('cfYes').addEventListener('click',()=>{ mroot.innerHTML=''; onYes(); });

function renderForm(){
  const editing=state.editingId?state.index.find(x=>x.id===state.editingId):null;
  const d=editing||{code:'',name:'',priceJPY:'',size:'',condition:'',note:'',category:'Furisode'};

    <div class="field"><label>Ảnh (tối đa 5 tấm)</label><div class="thumbs-row" id="thumbsRow"></div><div class="upload-box" id="uploadBox">📷 Bấm để chọn ảnh<input type="file" id="fileIn" accept="image/*" multiple style="display:none"></div><div class="hint">Ảnh tự nén. Khuyến nghị tỷ lệ 3:4.</div></div>

    <div class="row2"><div class="field"><label>Loại</label><select id="f_cat">${CATS.map(c=>`<option value="${c}" ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Giá (JPY)</label><input type="number" id="f_price" value="${d.priceJPY!=null?d.priceJPY:''}" placeholder="8500"></div></div>
    <div class="field"><label>Tình trạng vật lý</label><input type="text" id="f_cond" value="${esc(d.condition||'')}" placeholder="Như mới"></div>
    <div class="field"><label>Ghi chú</label><textarea id="f_note" placeholder="Nguồn hàng, phụ kiện...">${esc(d.note||'')}</textarea></div>
    <div style="display:flex;gap:12px;margin-top:8px;">
      <button class="btn-primary" id="saveBtn" style="flex:1">${editing?'Lưu thay đổi':'Thêm vào danh mục'}</button>
      ${editing?'<button class="btn-secondary" id="cancelBtn">Huỷ</button>':''}
    </div>
    <hr style="margin:32px 0;border:none;border-top:1px solid #e8e0d5;">
    <h2>Cài đặt cửa hàng</h2>
    <div class="settings-box"><h4>Thông tin chuyển khoản</h4>
      <div class="row2"><div class="field"><label>Tên tài khoản</label><input type="text" id="s_aname" value="${esc(state.settings.bankAccountName||'')}"></div><div class="field"><label>Số tài khoản</label><input type="text" id="s_anum" value="${esc(state.settings.bankAccountNumber||'')}"></div></div>
      <div class="field"><label>Ngân hàng</label><input type="text" id="s_bname" value="${esc(state.settings.bankName||'')}"></div>
      <div class="field"><label>Ảnh QR</label><div class="upload-box" id="qrBox" style="height:60px;display:flex;align-items:center;justify-content:center;">${state.settings.bankQR?`<img src="${state.settings.bankQR}" style="height:50px;">`:'📎 Chọn ảnh QR'}<input type="file" id="qrIn" accept="image/*" style="display:none"></div></div>
      <button class="btn-secondary" id="saveSettings" style="width:100%">Lưu cài đặt</button>
    </div>
    <div class="settings-box"><h4>Đổi mã quản trị</h4><div class="field"><label>Mã mới</label><input type="password" id="s_newpin" placeholder="••••" autocomplete="off"></div><button class="btn-secondary" id="savePin" style="width:100%">Đổi mã</button></div>
  </div>`;

  renderThumbs(); updateUploadBox();
  document.getElementById('uploadBox').addEventListener('click',()=>{ if(state.formImages.length>=5) return; document.getElementById('fileIn').click(); });
  document.getElementById('fileIn').addEventListener('change',handleFiles);
  if(editing){ document.getElementById('cancelBtn').addEventListener('click',()=>{ state.editingId=null; state.formImages=[]; setTab('shop'); }); }
  document.getElementById('saveBtn').addEventListener('click',onSave);
  document.getElementById('qrBox').addEventListener('click',()=>document.getElementById('qrIn').click());
  document.getElementById('qrIn').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; try{ state.settings.bankQR=await compressImage(f,400,0.8); document.getElementById('qrBox').innerHTML=`<img src="${state.settings.bankQR}" style="height:50px;">`; }catch(ex){ toast('Lỗi ảnh QR'); } });
  document.getElementById('saveSettings').addEventListener('click',async()=>{ state.settings.bankAccountName=document.getElementById('s_aname').value.trim(); state.settings.bankAccountNumber=document.getElementById('s_anum').value.trim(); state.settings.bankName=document.getElementById('s_bname').value.trim(); try{ await saveSettings(); toast('Đã lưu cài đặt'); }catch(e){ toast('Lỗi lưu'); } });
  document.getElementById('savePin').addEventListener('click',async()=>{ const np=document.getElementById('s_newpin').value.trim(); if(!np){ toast('Nhập mã mới'); return; } state.settings.adminPin=np; try{ await saveSettings(); toast('Đã đổi mã'); document.getElementById('s_newpin').value=''; }catch(e){ toast('Lỗi'); } });

async function handleFiles(e){
  const files=Array.from(e.target.files).slice(0,5-state.formImages.length); e.target.value=''; if(!files.length) return;
  updateUploadBox(true);
  try{ for(const f of files){ state.formImages.push(await compressImage(f,900,0.65)); } }catch(err){ toast('Lỗi ảnh'); }
  renderThumbs(); updateUploadBox();
}
function updateUploadBox(loading=false){
  const box=document.getElementById('uploadBox'); if(!box) return;
  const rem=5-state.formImages.length;
  if(loading){ box.innerHTML='<div class="spinner dark"></div> Đang xử lý…'; box.classList.add('dis'); return; }
  if(rem<=0){ box.innerHTML='Đã đủ 5 ảnh'; box.classList.add('dis'); return; }
  box.classList.remove('dis');
  box.innerHTML=`📷 Bấm để chọn ảnh (còn ${rem} chỗ)<input type="file" id="fileIn" accept="image/*" multiple style="display:none">`;
  document.getElementById('fileIn').addEventListener('change',handleFiles);
}
function renderThumbs(){
  const row=document.getElementById('thumbsRow'); if(!row) return;
  row.innerHTML=state.formImages.map((s,i)=>`<div class="thumb-slot"><img src="${s}" alt=""><button class="thumb-rm" data-i="${i}">✕</button></div>`).join('');
  row.querySelectorAll('.thumb-rm').forEach(btn=>{ btn.addEventListener('click',()=>{ state.formImages.splice(+btn.dataset.i,1); renderThumbs(); updateUploadBox(); }); });
}
async function onSave(){
  const code=document.getElementById('f_code').value.trim(); if(!code){ toast('Nhập mã kimono'); return; }
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Đang lưu…';
  const id=state.editingId||uid();
  const existing=state.editingId?state.index.find(x=>x.id===id):null;
  const item={ id, code, name:document.getElementById('f_name').value.trim(), priceJPY:document.getElementById('f_price').value===''?null:parseFloat(document.getElementById('f_price').value), size:document.getElementById('f_size').value.trim(), condition:document.getElementById('f_cond').value.trim(), note:document.getElementById('f_note').value.trim(), category:document.getElementById('f_cat').value, status:existing?(existing.status||'available'):'available', images:state.formImages.slice(0,5) };
  try{
    await saveItem(item);
    const meta={...item}; delete meta.images; meta.imageCount=item.images.length;
    const idx=state.index.findIndex(x=>x.id===id);
    if(idx>=0) state.index[idx]=meta; else state.index.push(meta);
    await saveIndex();
    toast(state.editingId?'Đã lưu thay đổi':'Đã thêm mẫu mới!');
    state.editingId=null; state.formImages=[]; setTab('shop');
  }catch(err){ toast('Lỗi lưu: '+(err.message||'')); btn.disabled=false; btn.textContent='Thử lại'; }
}

function renderManage(){
  root.innerHTML=`<div class="admin-wrap"><h2>Quản lý danh mục</h2>
    <div class="info-banner">📋 Sửa giá hàng loạt, đổi thứ tự hiển thị (↑↓). Bấm "Lưu tất cả" sau khi sửa xong.</div>

      <input type="file" id="impIn" accept="application/json" style="display:none">
    </div>
    <div class="field"><input type="text" id="mgSearch" placeholder="Tìm mã hoặc tên…"></div>
    <div class="mg-table"><div class="mg-row mg-head"><span></span><span></span><span>Mã / Tên</span><span>Giá JPY</span><span>Trạng thái</span></div><div id="mgRows"></div></div>

  document.getElementById('mgSave').addEventListener('click',async()=>{ document.querySelectorAll('.mg-price').forEach(inp=>{ const it=state.index.find(x=>x.id===inp.dataset.id); if(it) it.priceJPY=inp.value===''?null:parseFloat(inp.value); }); document.querySelectorAll('.mg-status').forEach(sel=>{ const it=state.index.find(x=>x.id===sel.dataset.id); if(it) it.status=sel.value; }); try{ await saveIndex(); toast('Đã lưu'); render(); }catch(e){ toast('Lỗi lưu'); } });
  document.getElementById('expBtn').addEventListener('click',async()=>{ const btn=document.getElementById('expBtn'); btn.disabled=true; btn.textContent='Đang tải…'; try{ const items=await Promise.all(state.index.map(it=>loadItem(it.id))); const blob=new Blob([JSON.stringify({settings:state.settings,index:state.index,items:items.filter(Boolean)},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='kimono-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('Đã tải file sao lưu'); }catch(e){ toast('Lỗi sao lưu'); } btn.disabled=false; btn.textContent='⬇ Sao lưu (JSON)'; });
  document.getElementById('impBtn').addEventListener('click',()=>document.getElementById('impIn').click());
  document.getElementById('impIn').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const data=JSON.parse(await f.text()); if(!data.index||!Array.isArray(data.index)){ toast('File không hợp lệ'); return; } for(const item of (data.items||[])) await saveItem(item); state.index=data.index; if(data.settings){ const pin=state.settings.adminPin; state.settings={...state.settings,...data.settings}; if(pin) state.settings.adminPin=pin; } await saveIndex(); await saveSettings(); toast('Nhập thành công '+(data.items||[]).length+' mẫu'); render(); }catch(err){ toast('Lỗi nhập: '+(err.message||'')); } });
}
function renderMgRows(items){
  const rows=document.getElementById('mgRows'); if(!rows) return;
  rows.innerHTML=items.map(it=>`<div class="mg-row" data-id="${it.id}"><div class="reorder"><button class="mg-up" data-idx="${state.index.indexOf(it)}">▲</button><button class="mg-down" data-idx="${state.index.indexOf(it)}">▼</button></div><img class="mg-thumb" data-mgthumb="${it.id}" src="" alt=""><div class="mg-info"><div class="code">${esc(it.code||'')}</div><div class="name">${esc(it.name||'')}</div></div><input class="mg-price" type="number" data-id="${it.id}" value="${it.priceJPY!=null?it.priceJPY:''}" placeholder="JPY"><select class="mg-status" data-id="${it.id}">${Object.entries(SL).map(([v,l])=>`<option value="${v}" ${(it.status||'available')===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('');

function renderCart(){
  const ids=Object.keys(state.cart).filter(id=>state.cart[id]);
  const items=ids.map(id=>state.index.find(x=>x.id===id)).filter(Boolean);
  const totalJPY=items.reduce((s,it)=>s+(it.priceJPY||0),0);
  const totalVND=totalJPY*state.settings.exchangeRate;
  root.innerHTML=`<div class="admin-wrap" style="max-width:640px;"><h2>Giỏ hàng</h2>
    ${items.length===0?'<div class="empty-state"><div class="icon">🛒</div><p>Giỏ hàng trống. Vào cửa hàng để chọn mẫu.</p></div>':''}
    <div id="cartItems"></div>
    ${items.length>0?`<div class="cart-total"><div><div class="lbl">Tổng JPY</div><div style="font-size:14px;color:#9AA5BD;">${fmtJPY(totalJPY)}</div></div><div class="val">${fmtVND(totalVND)}</div></div><div style="display:flex;gap:10px;margin-top:12px;"><button class="btn-secondary" id="clearCart">Xoá giỏ</button><button class="btn-primary" id="checkoutBtn" style="flex:1;">Thanh toán & xem thông tin</button></div>`:''}
  </div>`;
  if(items.length>0){ document.getElementById('clearCart').addEventListener('click',()=>{ state.cart={}; updateCartBadge(); renderCart(); }); document.getElementById('checkoutBtn').addEventListener('click',()=>openCheckout(items,totalVND,totalJPY)); }
  const el=document.getElementById('cartItems'); if(!el) return;
  el.innerHTML=items.map(it=>{ const vnd=it.priceJPY!=null?it.priceJPY*state.settings.exchangeRate:null; return `<div class="cart-item"><img data-cthumb="${it.id}" alt=""><div class="ci-info"><div class="ci-code">${esc(it.code||'')}</div><div class="ci-name">${esc(it.name||'')}</div><div class="ci-price">${fmtVND(vnd)}</div></div><button class="ci-rm" data-rid="${it.id}">✕</button></div>`; }).join('');
  el.querySelectorAll('.ci-rm').forEach(btn=>{ btn.addEventListener('click',()=>{ delete state.cart[btn.dataset.rid]; updateCartBadge(); renderCart(); }); });
  lazyLoad('[data-cthumb]','cthumb');
}

function openCheckout(items,totalVND,totalJPY){
  const s=state.settings;
  const lines=items.map(it=>{ const v=it.priceJPY!=null?it.priceJPY*s.exchangeRate:null; return `• ${it.code||''} ${it.name||''}: ${fmtJPY(it.priceJPY)} (${fmtVND(v)})`; });
  const txt=`Đơn hàng ${items.length} mẫu:\n${lines.join('\n')}\n\nTỔNG JPY: ${fmtJPY(totalJPY)}\nTỔNG VND: ${fmtVND(totalVND)}\n(1 JPY = ${s.exchangeRate} VND)${s.bankAccountNumber?'\n\nCK: '+(s.bankAccountName||'')+' - '+s.bankAccountNumber+(s.bankName?' ('+s.bankName+')':''):''}`;
  mroot.innerHTML=`<div class="overlay" id="coO"><div class="sheet"><div class="sheet-head"><h3>Xác nhận đơn hàng</h3><button class="close-x" id="coX">✕</button></div><div class="sheet-body">
    ${items.map(it=>{ const v=it.priceJPY!=null?it.priceJPY*s.exchangeRate:null; return `<div class="checkout-line"><span>${esc(it.code||'')} ${esc(it.name||'')}</span><span>${fmtJPY(it.priceJPY)} · ${fmtVND(v)}</span></div>`; }).join('')}
    <div class="checkout-line total"><span>Tổng JPY</span><span>${fmtJPY(totalJPY)}</span></div>
    <div class="checkout-line total"><span>Tổng VND</span><span>${fmtVND(totalVND)}</span></div>
    <div style="font-size:12px;color:#888;font-family:Arial,sans-serif;margin-top:4px;">Tỷ giá: 1 JPY = ${s.exchangeRate} VND</div>
    ${(s.bankQR||s.bankAccountNumber)?`<div class="bank-box">${s.bankQR?`<img src="${s.bankQR}">`:''}<div class="bname">${esc(s.bankAccountName||'')}</div><div class="bnum">${esc(s.bankAccountNumber||'')}</div><div class="bbank">${esc(s.bankName||'')}</div><button class="btn-secondary" id="copyAcc" style="margin-top:8px;width:100%;">Sao chép số tài khoản</button></div>`:''}
    <div class="sheet-actions"><button class="btn-secondary" id="copyOrder">Sao chép đơn hàng</button><button class="btn-primary" id="coDone">Xong</button></div>
  </div></div></div>`;
  document.getElementById('coO').addEventListener('click',e=>{ if(e.target.id==='coO') mroot.innerHTML=''; });
  document.getElementById('coX').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('coDone').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('copyOrder').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(txt); toast('Đã sao chép — dán vào Zalo gửi khách'); }catch(e){ toast('Không sao chép được'); } });
  const ca=document.getElementById('copyAcc'); if(ca) ca.addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(s.bankAccountNumber); toast('Đã sao chép số tài khoản'); }catch(e){ toast('Không sao chép được'); } });
}

// ═══ LAZY LOAD ═══
function lazyLoad(sel,key){
  const els=document.querySelectorAll(sel);
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(async entry=>{
      if(!entry.isIntersecting) return; obs.unobserve(entry.target);
      const id=entry.target.dataset[key];
      const item=await loadItem(id);
      if(!item||!item.images||!item.images[0]) return;
      const el=entry.target;
      if(el.tagName==='IMG'){ el.src=item.images[0]; }
      else { el.innerHTML=`<img src="${item.images[0]}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">${item.images.length>1?`<div class="img-count">1/${item.images.length}</div>`:''}`; }
    });
  },{rootMargin:'150px'});
  els.forEach(el=>obs.observe(el));
}

// ═══ INIT ═══
async function init(){
  // Load từ localStorage
  try{ await Promise.all([loadSettings(), loadIndex()]); }
  catch(e){ console.error(e); }

  // Nếu trống -> load 52 mẫu từ seed ngay vào memory
  if(state.index.length === 0){
    state.index = SEED_INDEX;
    for(const item of SEED_ITEMS){ state.itemCache[item.id] = item; }
    const s = JSON.parse(JSON.stringify(SEED_SETTINGS_DEFAULTS));
    state.settings = {...state.settings, ...s};
    // Thử lưu vào localStorage (không bắt buộc)
    try{
      for(const item of SEED_ITEMS){
        localStorage.setItem('kimono_item_' + item.id, JSON.stringify(item));
      }
      localStorage.setItem('kimono_index', JSON.stringify(state.index));
    }catch(e){ console.warn('localStorage error:', e); }
  }

  state.loaded = true;
  render();
}
init();
</script>
