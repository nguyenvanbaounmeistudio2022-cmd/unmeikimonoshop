<title>UNMEI Kimono Shop — Kimono Nhật Bản Chính Hãng</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── DESIGN SYSTEM TOKENS (Linear dark canvas) ── */
:root {
  --canvas:    #010102;
  --surface-1: #0f1011;
  --surface-2: #141516;
  --surface-3: #18191a;
  --hairline:  #23252a;
  --hairline-strong: #34343a;
  --ink:       #f7f8f8;
  --ink-muted: #d0d6e0;
  --ink-subtle:#8a8f98;
  --ink-tertiary:#62666d;
  --primary:   #5e6ad2;
  --primary-hover:#828fff;
  --primary-focus:#5e69d1;
  --success:   #27a644;
  --gold:      #c9a84c;  /* kimono accent – used only for logo & hero tag */
}

body {
  font-family: 'SF Pro Display',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
header {
  background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
  color: var(--ink);
  padding: 0 32px;
  display: flex; align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky; top: 0; z-index: 50;
}
.logo {
  font-size: 18px; font-weight: 600;
  letter-spacing: -0.4px; font-style: normal;
  color: var(--ink);
}
.logo span { color: var(--primary); }
.header-right { display:flex; align-items:center; gap:4px; }
.nav-btn {
  background: transparent; border: none; color: var(--ink-subtle);
  font-size: 14px; font-weight: 500; letter-spacing: 0;
  padding: 0 14px; height: 56px; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { color: var(--ink); border-bottom-color: var(--primary); }
.cart-btn {
  background: transparent; border: none; color: var(--ink-subtle);
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 56px;
  transition: color .15s;
}
.cart-btn:hover { color: var(--ink); }
.cart-dot {
  background: var(--primary); color: #fff; border-radius: 50%;
  width: 18px; height: 18px; font-size: 11px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
}
.lock-btn { background:transparent; border:none; cursor:pointer; font-size:16px; padding:0 8px; color:var(--ink-subtle); }

.hero h1 {
  font-size: 56px; font-weight: 600;
  line-height: 1.10; letter-spacing: -1.8px;
  margin-bottom: 16px; color: var(--ink);
  font-style: normal;
}
.hero p {
  font-size: 16px; color: var(--gold);
  margin-bottom: 32px; letter-spacing: 2px;
  font-weight: 500;
}
.hero-btn {
  display: inline-block;
  background: var(--primary); color: #fff;
  padding: 10px 24px; border-radius: 8px;
  text-decoration: none; font-size: 14px; font-weight: 500;
  letter-spacing: 0; transition: background .15s;
}
.hero-btn:hover { background: var(--primary-hover); }

/* ── STATS BAR ── */
.stats-bar {
  display: flex; background: var(--surface-1);
  border-bottom: 1px solid var(--hairline);
}
.stat-item {
  flex: 1; text-align: center;
  padding: 16px 8px;
  border-right: 1px solid var(--hairline);
}
.stat-item:last-child { border-right: none; }
.stat-item .val {
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.6px; color: var(--ink);
}
.stat-item .val.ok { color: var(--success); }
.stat-item .lbl {
  font-size: 11px; color: var(--ink-subtle);
  margin-top: 2px; letter-spacing: 0.4px; text-transform: uppercase;
}

/* ── EXCHANGE RATE BAR ── */
.rate-bar {
  background: var(--surface-1);
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center;
  padding: 8px 24px; gap: 12px;
  font-size: 13px; color: var(--ink-subtle);
}
.rate-bar input {
  width: 90px; background: var(--surface-2);
  border: 1px solid var(--hairline-strong);
  border-radius: 6px; color: var(--ink);
  padding: 4px 8px; font-size: 13px;
}
.rate-bar label { color: var(--ink-subtle); }

/* ── FILTER BAR ── */
.filter-bar {
  background: var(--canvas);
  border-bottom: 1px solid var(--hairline);
  padding: 12px 24px;
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.filter-btn {
  background: var(--canvas); color: var(--ink-subtle);
  border: 1px solid var(--hairline);
  border-radius: 9999px; padding: 5px 14px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.filter-btn:hover { color: var(--ink); border-color: var(--hairline-strong); }
.filter-btn.active {
  background: var(--surface-2); color: var(--ink);
  border-color: var(--hairline-strong);
}
.search-input {
  margin-left: auto;
  background: var(--surface-1); color: var(--ink);

/* ── SECTION HEADING ── */

/* ── PRODUCT GRID ── */

/* ── PRODUCT CARD ── */

let ghFileSha = null; // sha để update file

async function ghLoad(){
  try{
    // Dùng raw để bypass cache
    const url = `https://raw.githubusercontent.com/${GH_REPO}/main/${GH_FILE}?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return data;
  }catch(e){ return null; }
}

async function ghGetSha(){
  try{
    const res = await fetch(GH_API, {headers:{'Authorization':`token ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(!res.ok) return null;
    const data = await res.json();
    ghFileSha = data.sha;
    return data.sha;
  }catch(e){ return null; }
}

async function ghSave(payload){
  // payload = {index, items, settings}
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 0))));
  if(!ghFileSha) await ghGetSha();
  const body = {message:'Update kimono data', content, ...(ghFileSha?{sha:ghFileSha}:{})};
  try{
    const res = await fetch(GH_API, {
      method:'PUT',
      headers:{'Authorization':`token ${GH_TOKEN}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(data.content) ghFileSha = data.content.sha;
    return res.ok;
  }catch(e){ return false; }
}

// ═══ INDEXEDDB STORAGE — không giới hạn dung lượng ═══
const DB_NAME = 'KimonoShopDB';
const DB_VERSION = 1;
let _db = null;

function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains('items')) db.createObjectStore('items', {keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'key'});
    };
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}

function dbGet(store, key){
  return openDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
}

function dbPut(store, value){
  return openDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  }));
}

function dbDelete(store, key){
  return openDB().then(db => new Promise((res,rej)=>{
    const tx = db.transaction(store,'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  }));
}

// Push toàn bộ dữ liệu lên GitHub (gọi sau mỗi lần save)
async function ghPushAll(){
  try{
    const allItems = [];
    for(const meta of state.index){
      const item = state.itemCache[meta.id] || SEED_ITEMS.find(x=>x.id===meta.id) || meta;
      // Chỉ lưu Cloudinary URLs, bỏ base64 để file nhỏ
      const cleanItem = {...item};
      if(cleanItem.images){
        cleanItem.images = cleanItem.images.filter(img=>img.startsWith('https://'));
      }
      allItems.push(cleanItem);
    }
    const payload = {
      index: state.index,
      items: allItems,
      settings: {...state.settings, adminPin: undefined}
    };
    const ok = await ghSave(payload);
    if(ok) toast('✅ Đã đồng bộ lên GitHub');
    else toast('⚠️ Không thể đồng bộ GitHub');
  }catch(e){ console.error('ghPushAll error:', e); }
}
async function loadItem(id){
  // DB trước (lưu thay đổi) -> cache -> seed
  try{
    const rec = await dbGet('items', id);
    if(rec){ state.itemCache[id]=rec; return rec; }
  }catch(e){}
  if(state.itemCache[id]) return state.itemCache[id];
  const seed = SEED_ITEMS.find(x=>x.id===id);
  if(seed){ state.itemCache[id]=seed; return seed; }
  return null;
}
async function saveItem(item){
  await dbPut('items', item);
  state.itemCache[item.id] = item;
}
async function deleteItemDB(id){
  try{ await dbDelete('items', id); }catch(e){}
  delete state.itemCache[id];
}

// ═══ FIREBASE STORAGE ═══
// Storage functions defined above (localStorage)

function compressImage(file, _maxDim, _q) {
  // Quality-first compression:
  // 1. Cap resolution at 1800px (giữ nét, đủ cho web 2x retina)
  // 2. Dùng WebP nếu trình duyệt hỗ trợ (nhỏ hơn JPEG 30-40% cùng chất lượng)
  // 3. Binary search quality 0.92→0.70, giảm quality thay vì giảm size
  // 4. Chỉ thu nhỏ thêm nếu quality 0.70 vẫn > 1.5MB (ảnh cực lớn)
  const MAX_DIM    = 2400;        // px — giữ đủ nét cho màn hình retina
  const TARGET     = 2 * 1024 * 1024;  // 2MB — thoải mái, nét rõ
  const HARD_LIMIT = 3 * 1024 * 1024;  // 3MB — hard limit tối đa

  const supportsWebP = (() => {
    try {
      const c = document.createElement('canvas');
      return c.toDataURL('image/webp').startsWith('data:image/webp');
    } catch { return false; }
  })();
  const fmt = supportsWebP ? 'image/webp' : 'image/jpeg';

  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('read fail'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode fail'));
      img.onload = () => {
        function drawCanvas(dim) {
          let w = img.width, h = img.height;
          if (w > h && w > dim) { h = Math.round(h * dim / w); w = dim; }
          else if (h >= w && h > dim) { w = Math.round(w * dim / h); h = dim; }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          // imageSmoothingQuality = high để giữ nét khi scale down
          const ctx = c.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          return c;
        }
        function approxBytes(dataUrl) {
          return (dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75;
        }
        function binarySearchQuality(canvas, lo, hi) {
          // Tìm quality cao nhất mà vẫn <= TARGET (tối đa 6 vòng)
          let best = canvas.toDataURL(fmt, hi);
          if (approxBytes(best) <= TARGET) return best; // quality cao nhất đã đủ nhỏ
          for (let i = 0; i < 6; i++) {
            const mid = (lo + hi) / 2;
            const attempt = canvas.toDataURL(fmt, mid);
            if (approxBytes(attempt) <= TARGET) { best = attempt; lo = mid; }
            else { hi = mid; }
            if (hi - lo < 0.02) break;
          }
          return best;
        }

        // Bước 1: vẽ canvas ở MAX_DIM, thử quality 0.95
        let canvas = drawCanvas(MAX_DIM);
        let dataUrl = canvas.toDataURL(fmt, 0.95);
        if (approxBytes(dataUrl) <= TARGET) { res(dataUrl); return; }

        // Bước 2: binary search quality 0.85→0.95 trên canvas MAX_DIM
        dataUrl = binarySearchQuality(canvas, 0.85, 0.95);
        if (approxBytes(dataUrl) <= HARD_LIMIT) { res(dataUrl); return; }

        // Bước 3: ảnh vẫn quá lớn → thu nhỏ dần (chỉ khi thực sự cần)
        for (const dim of [2000, 1800, 1600, 1400]) {
          canvas = drawCanvas(dim);
          dataUrl = binarySearchQuality(canvas, 0.85, 0.95);
          if (approxBytes(dataUrl) <= HARD_LIMIT) break;
        }
        res(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ═══ TAB ═══
function setTab(tab){
  state.tab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  requestAnimationFrame(()=>render());
}
document.querySelectorAll('.nav-btn, .cart-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    if((b.dataset.tab==='form'||b.dataset.tab==='manage') && !state.unlocked){
      requireAdmin(()=>setTab(b.dataset.tab));
    } else {
      setTab(b.dataset.tab);
    }
  });
});

// ═══ PIN ═══
function requireAdmin(cb){ if(state.unlocked){ cb(); return; } showPin(cb); }
document.getElementById('lockBtn').addEventListener('click',()=>{
  if(state.unlocked){ state.unlocked=false; document.getElementById('lockBtn').textContent='🔒'; toast('Đã khoá lại'); if(state.tab==='form'||state.tab==='manage') setTab('shop'); }
  else requireAdmin(()=>{ document.getElementById('lockBtn').textContent='🔓'; toast('Đã mở khoá'); });
});
function showPin(cb){
  const hasPin=!!state.settings.adminPin;
  mroot.innerHTML=`<div class="overlay" id="pinO"><div class="sheet" style="max-width:360px;"><div class="sheet-head"><h3>${hasPin?'Nhập mã quản trị':'Tạo mã quản trị'}</h3><button class="close-x" id="pinX">✕</button></div><div class="sheet-body">${!hasPin?'<p style="font-size:13px;color:var(--ink-subtle);font-family:Arial,sans-serif;margin-bottom:14px;">Lần đầu — tạo mã để bảo vệ trang quản lý.</p>':''}<div class="field"><label>${hasPin?'Mã':'Mã mới'}</label><input type="password" id="pinIn" placeholder="••••" autocomplete="off"></div><button class="btn-primary" id="pinOk" style="width:100%">${hasPin?'Xác nhận':'Tạo mã'}</button></div></div></div>`;
  document.getElementById('pinO').addEventListener('click',e=>{ if(e.target.id==='pinO') mroot.innerHTML=''; });
  document.getElementById('pinX').addEventListener('click',()=>mroot.innerHTML='');
  const go=async()=>{
    const v=document.getElementById('pinIn').value.trim(); if(!v){ toast('Nhập mã'); return; }
    if(!hasPin){ state.settings.adminPin=v; try{await saveSettings();}catch(e){} state.unlocked=true; document.getElementById('lockBtn').textContent='🔓'; mroot.innerHTML=''; toast('Đã tạo mã'); cb(); }
    else if(v===state.settings.adminPin){ state.unlocked=true; document.getElementById('lockBtn').textContent='🔓'; mroot.innerHTML=''; cb(); }
    else toast('Sai mã');
  };
  document.getElementById('pinOk').addEventListener('click',go);
  document.getElementById('pinIn').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  setTimeout(()=>{ const el=document.getElementById('pinIn'); if(el) el.focus(); },100);
}

// ═══ RENDER ═══
function render(){
  if(!state.loaded){ root.innerHTML='<div class="loading-center"><div class="spinner dark"></div><p style="margin-top:12px;">Đang tải…</p></div>'; return; }
  if(state.tab==='shop') renderShop();
  else if(state.tab==='form') renderForm();
  else if(state.tab==='manage') renderManage();
  else if(state.tab==='cart') renderCart();
}

    if(!state.shopShowUnavail&&(it.status||'available')!=='available') return false;

  </div>
  <div class="rate-bar">Tỷ giá: 1 JPY = <input type="number" id="rateIn" value="${state.settings.exchangeRate}" step="0.1"> VND &nbsp;|&nbsp; <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-family:Arial,sans-serif;"><input type="checkbox" id="showUnavail" ${state.shopShowUnavail?'checked':''}> Hiện cả đã bán</label></div>
  <div class="filter-bar" id="products">
    <span>Lọc:</span>
    <button class="filter-btn ${state.shopCat==='all'?'active':''}" data-cat="all">Tất cả</button>
    ${CATS.map(c=>`<button class="filter-btn ${state.shopCat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
    <input class="search-inp" id="shopSearch" type="text" placeholder="Tìm mã, tên…" value="${esc(state.shopSearch)}">

function shopCard(it){
  const status=it.status||'available';
  const inCart=!!state.cart[it.id];
  const dis=status!=='available';
  const vnd=it.priceJPY!=null?it.priceJPY*state.settings.exchangeRate:null;
  let ribbon='';
  if(status==='sold') ribbon='<div class="ribbon sold">ĐÃ BÁN</div>';
  else if(status==='reserved') ribbon='<div class="ribbon reserved">ĐANG GIỮ</div>';
  return `<div class="product-card ${dis?'unavail':''}" data-id="${it.id}">
    <div class="product-img" data-sthumb="${it.id}">
      <div class="kanji">👘</div><span class="ph">👘</span>
      ${it.imageCount>1?`<div class="img-count">1/${it.imageCount}</div>`:''}
      ${ribbon}
    </div>
    <div class="product-info">
      ${it.category?`<div class="product-cat">${esc(it.category)}</div>`:''}
      <div class="product-code">${esc(it.code||'')}</div>
      <div class="product-name">${esc(it.name||'(chưa đặt tên)')}</div>
      <div class="product-desc">${esc(it.condition||'')}${it.size?' · Size '+esc(it.size):''}</div>
      <div class="product-footer">
        <div><div class="price">${vnd!=null?fmtVND(vnd):'—'}</div><div class="price-jpy">${fmtJPY(it.priceJPY)}</div></div>
        <button class="add-btn ${inCart?'in-cart':''}" data-cid="${it.id}" ${dis?'disabled':''}>${dis?SL[status]:(inCart?'✓ Trong giỏ':'+ Giỏ hàng')}</button>
      </div>
    </div>
  </div>`;
}

// Tính mã tiếp theo theo loại
function nextCode(cat){
  const prefixMap={'Furisode':'FU','Houmongi':'HM','Tomesode':'TM','Yukata':'YU','Uchikake':'UC','Komon':'KM','Hakama':'HK','Obi':'OB','Đồ trẻ em':'TE','Khác':'KH'};
  const prefix = prefixMap[cat]||'KM';
  const nums = state.index
    .filter(x=>x.category===cat)
    .map(x=>{ const m=(x.code||'').match(/(\d+)$/); return m?parseInt(m[1]):0; })
    .filter(n=>!isNaN(n));
  const next = nums.length>0 ? Math.max(...nums)+1 : 1;
  return `${prefix}-${String(next).padStart(3,'0')}`;
}

// AI mô tả ảnh
async function aiDescribeImages(){
  const btn=document.getElementById('aiDescBtn');
  if(!btn) return;
  if(state.formImages.length===0){ toast('Hãy upload ảnh trước'); return; }
  btn.disabled=true; btn.textContent='🤖 Đang phân tích…';
  try{
    // Lấy ảnh đầu tiên
    const img0=state.formImages[0];
    const cat=document.getElementById('f_cat').value;
    // Chuẩn bị content
    let imgContent;
    if(img0.startsWith('https://')){
      imgContent={type:'image',source:{type:'url',url:img0}};
    } else {
      // base64
      const m=img0.match(/^data:([^;]+);base64,(.+)$/);
      if(!m){ toast('Không thể đọc ảnh'); btn.disabled=false; btn.textContent='🤖 AI mô tả'; return; }
      imgContent={type:'image',source:{type:'base64',media_type:m[1],data:m[2]}};
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:400,

async function handleFiles(e){
  const files=Array.from(e.target.files).slice(0,5-state.formImages.length); e.target.value=''; if(!files.length) return;
  updateUploadBox(true);
  try{
    for(const f of files){
      const origKB = Math.round(f.size/1024);
      const origLabel = origKB>=1024 ? (origKB/1024).toFixed(1)+'MB' : origKB+'KB';
      toast(`⏳ Đang upload ${origLabel} lên Cloudinary…`);
      const url = await processImageFile(f, true);
      state.formImages.push(url);
      const isCloud = url.startsWith('https://res.cloudinary');
      toast(isCloud ? `✅ Upload Cloudinary thành công!` : `✅ Lưu ảnh thành công`);
    }
  }catch(err){ toast('Lỗi upload: '+(err.message||'')); }
  renderThumbs(); updateUploadBox();
}
function updateUploadBox(loading=false){
  const box=document.getElementById('uploadBox'); if(!box) return;
  const rem=5-state.formImages.length;
  if(loading){ box.innerHTML='<div class="spinner dark"></div> Đang xử lý…<input type="file" id="fileIn" accept="image/*" multiple style="display:none">'; box.classList.add('dis'); }
  else if(rem<=0){ box.innerHTML='Đã đủ 5 ảnh<input type="file" id="fileIn" accept="image/*" multiple style="display:none">'; box.classList.add('dis'); }
  else { box.classList.remove('dis'); box.innerHTML=`📷 Bấm để chọn ảnh (còn ${rem} chỗ)<input type="file" id="fileIn" accept="image/*" multiple style="display:none">`; }
  const fi=document.getElementById('fileIn');
  if(fi){ fi.removeEventListener('change',handleFiles); fi.addEventListener('change',handleFiles); }
}
function renderThumbs(){
  const row=document.getElementById('thumbsRow'); if(!row) return;
  row.innerHTML=state.formImages.map((s,i)=>`<div class="thumb-slot"><img src="${s}" alt=""><button class="thumb-rm" data-i="${i}">✕</button></div>`).join('');

async function onSave(){

// ═══ CLOUDINARY UPLOAD ═══
const CLOUDINARY_CLOUD = 'qfba57kr';
const CLOUDINARY_PRESET = 'kimono_upload';
const CLOUDINARY_FOLDER = 'kimono';

async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  formData.append('folder', CLOUDINARY_FOLDER);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
    method: 'POST', body: formData
  });
  if (!res.ok) throw new Error('Upload Cloudinary thất bại');
  const data = await res.json();
  // Return optimized URL
  return `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/upload/q_auto,f_auto,w_1800/${data.public_id}`;
}

async function processImageFile(file, useCloudinary=true) {
  if (useCloudinary) {
    try { return await uploadToCloudinary(file); } catch(e) { console.warn('Cloudinary fail, fallback base64:', e); }
  }
  return await compressImage(file);
}

  });
  document.getElementById('bulkInitBtn').addEventListener('click', buildBulkSlots);
  document.getElementById('bulkSaveBtn').addEventListener('click', saveBulkAll);

function populateBulkStart(){

}

const bulkData={}; // id → [dataUrl, ...]

function buildBulkSlots(){
  const startIdx=parseInt(document.getElementById('bulkStartSel').value||0);
  const count=parseInt(document.getElementById('bulkCountSel').value||5);
  const items=state.index.slice(startIdx, startIdx+count);
  const slots=document.getElementById('bulkSlots');
  const saveBtn=document.getElementById('bulkSaveBtn');
  // clear previous
  Object.keys(bulkData).forEach(k=>delete bulkData[k]);
  slots.innerHTML=items.map(it=>`
    <div class="bulk-slot" id="bslot_${it.id}">
      <div class="bulk-slot-header">${esc(it.code||'')} <span style="color:var(--gold);font-weight:400;font-size:12px;">(${items.indexOf(it)+1}/${items.length})</span></div>
      <div class="bulk-slot-name">${esc((it.name||'').slice(0,60))}${(it.name||'').length>60?'…':''}</div>
      <div class="bulk-thumbs" id="bthumbs_${it.id}"></div>
      <label class="bulk-add-btn">
        📷 Thêm ảnh (tối đa 5)
        <input type="file" accept="image/*" multiple style="display:none" data-bid="${it.id}">
      </label>
      <div class="bulk-count" id="bcount_${it.id}">0 / 5 ảnh</div>
    </div>
  `).join('');
  // init each slot
  items.forEach(it=>{
    bulkData[it.id]=[];
    slots.querySelector(`input[data-bid="${it.id}"]`).addEventListener('change',async e=>{
      const files=Array.from(e.target.files); e.target.value='';
      const remaining=5-bulkData[it.id].length;
      const toProcess=files.slice(0,remaining);
      const overlay=slots.querySelector(`#bcount_${it.id}`);
      overlay.textContent='⏳ Đang nén…';
      for(const f of toProcess){
        toast('⏳ Đang upload lên Cloudinary…');
        const url=await processImageFile(f, true);
        bulkData[it.id].push(url);
      }
      renderBulkThumbs(it.id);
      overlay.textContent=`${bulkData[it.id].length} / 5 ảnh`;
    });
  });
  saveBtn.style.display='block';
}

function renderBulkThumbs(id){
  const container=document.getElementById(`bthumbs_${id}`); if(!container) return;
  container.innerHTML=bulkData[id].map((url,i)=>`
    <div class="bulk-thumb">
      <img src="${url}" alt="">
      <button class="rm" data-bid="${id}" data-i="${i}">✕</button>
    </div>
  `).join('');
  container.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click',()=>{
      bulkData[btn.dataset.bid].splice(+btn.dataset.i,1);
      renderBulkThumbs(btn.dataset.bid);
      document.getElementById(`bcount_${btn.dataset.bid}`).textContent=`${bulkData[btn.dataset.bid].length} / 5 ảnh`;
    });
  });
}

async function saveBulkAll(){
  const btn=document.getElementById('bulkSaveBtn');
  const ids=Object.keys(bulkData).filter(id=>bulkData[id].length>0);
  if(!ids.length){ toast('Chưa có ảnh nào để lưu'); return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Đang lưu…';
  let saved=0;
  try{
    for(const id of ids){
      const existing=await loadItem(id)||state.index.find(x=>x.id===id)||{id};
      existing.images=bulkData[id];
      await saveItem(existing);
      // update index imageCount
      const meta=state.index.find(x=>x.id===id);
      if(meta) meta.imageCount=bulkData[id].length;
      saved++;
    }
    await saveIndex();
    toast(`✅ Đã lưu ảnh cho ${saved} mẫu!`);
    // clear
    Object.keys(bulkData).forEach(k=>delete bulkData[k]);
    document.getElementById('bulkSlots').innerHTML='';
    btn.style.display='none';
  }catch(e){ toast('Lỗi lưu: '+(e.message||'')); }
  btn.disabled=false; btn.innerHTML='💾 Lưu tất cả ảnh';
}

  document.getElementById('expBtn').addEventListener('click',async()=>{ const btn=document.getElementById('expBtn'); btn.disabled=true; btn.textContent='Đang tải…'; try{ const items=await Promise.all(state.index.map(it=>loadItem(it.id))); const blob=new Blob([JSON.stringify({settings:state.settings,index:state.index,items:items.filter(Boolean)},null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='kimono-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('Đã tải file sao lưu'); }catch(e){ toast('Lỗi sao lưu'); } btn.disabled=false; btn.textContent='⬇ Sao lưu (JSON)'; });
  document.getElementById('impBtn').addEventListener('click',()=>document.getElementById('impIn').click());
  document.getElementById('resetBtn').addEventListener('click',()=>{
    confirmModal('Xóa TOÀN BỘ dữ liệu sản phẩm? Hành động này không thể hoàn tác!', async()=>{
      try{
        // Delete all items from DB
        for(const it of state.index){ try{ await deleteItemDB(it.id); }catch(e){} }
        // Clear index and save
        state.index=[];
        await saveIndex();
        toast('✅ Đã xóa toàn bộ dữ liệu!');
        render();
      }catch(e){ toast('Lỗi xóa: '+(e.message||'')); }
    });
  });
  document.getElementById('impIn').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const data=JSON.parse(await f.text()); if(!data.index||!Array.isArray(data.index)){ toast('File không hợp lệ'); return; } /* MERGE */ for(const item of (data.items||[])) await saveItem(item); for(const meta of data.index){ const exists=state.index.findIndex(x=>x.id===meta.id); if(exists>=0) state.index[exists]=meta; else state.index.push(meta); } if(data.settings){ const pin=state.settings.adminPin; state.settings={...state.settings,...data.settings}; if(pin) state.settings.adminPin=pin; } await saveIndex(); await saveSettings(); toast('✅ Đã thêm '+(data.items||[]).length+' mẫu — tổng: '+state.index.length+' mẫu'); render(); }catch(err){ toast('Lỗi nhập: '+(err.message||'')); } });
}
function renderMgRows(items){
  const rows=document.getElementById('mgRows'); if(!rows) return;
  rows.innerHTML=items.map(it=>`<div class="mg-row" data-id="${it.id}">
    <div class="reorder"><button class="mg-up" data-idx="${state.index.indexOf(it)}">▲</button><button class="mg-down" data-idx="${state.index.indexOf(it)}">▼</button></div>
    <div class="mg-img-wrap" title="Bấm để thay ảnh">
      <img class="mg-thumb" data-mgthumb="${it.id}" src="" alt="">
      <div class="mg-img-overlay">📷</div>
      <input type="file" class="mg-img-input" accept="image/*" data-id="${it.id}" style="display:none">
    </div>
    <div class="mg-info"><div class="code">${esc(it.code||'')}</div><div class="name">${esc(it.name||'')}</div></div>
    <input class="mg-price" type="number" data-id="${it.id}" value="${it.priceJPY!=null?it.priceJPY:''}" placeholder="JPY">
    <select class="mg-status" data-id="${it.id}">${Object.entries(SL).map(([v,l])=>`<option value="${v}" ${(it.status||'available')===v?'selected':''}>${l}</option>`).join('')}</select>
  </div>`).join('');

  // reorder buttons
  rows.querySelectorAll('.mg-up,.mg-down').forEach(btn=>{ btn.addEventListener('click',()=>{ const i=+btn.dataset.idx; const j=btn.classList.contains('mg-up')?i-1:i+1; if(j<0||j>=state.index.length) return; [state.index[i],state.index[j]]=[state.index[j],state.index[i]]; renderManage(); }); });

  // inline image upload: click on thumb area → trigger file input
  rows.querySelectorAll('.mg-img-wrap').forEach(wrap=>{
    const inp=wrap.querySelector('.mg-img-input');
    wrap.addEventListener('click',()=>inp.click());
    inp.addEventListener('change',async e=>{
      const f=e.target.files[0]; e.target.value=''; if(!f) return;
      const id=inp.dataset.id;
      const img=wrap.querySelector('img');
      img.style.opacity='0.4';
      wrap.querySelector('.mg-img-overlay').textContent='⏳';
      try{
        const origKB=Math.round(f.size/1024);
        wrap.querySelector('.mg-img-overlay').textContent='⏳';
        toast('⏳ Đang upload lên Cloudinary…');
        const url = await processImageFile(f, true);
        const item=await loadItem(id)||{id};
        if(!item.images) item.images=[];
        item.images[0]=url;
        await saveItem(item);
        img.src=url;
        img.style.opacity='1';
        wrap.querySelector('.mg-img-overlay').textContent='📷';
        const isCloud=url.startsWith('https://res.cloudinary');
        toast(isCloud?'✅ Upload Cloudinary thành công!':'✅ Ảnh đã lưu');
      }catch(err){
        img.style.opacity='1';
        wrap.querySelector('.mg-img-overlay').textContent='📷';
        toast('Lỗi upload ảnh');
      }
    });
  });

  lazyLoad('[data-mgthumb]','mgthumb');
}

// ═══ CART ═══
function renderCart(){
  const ids=Object.keys(state.cart).filter(id=>state.cart[id]);
  const items=ids.map(id=>state.index.find(x=>x.id===id)).filter(Boolean);
  const totalJPY=items.reduce((s,it)=>s+(it.priceJPY||0),0);
  const totalVND=totalJPY*state.settings.exchangeRate;
  root.innerHTML=`<div class="admin-wrap" style="max-width:640px;"><h2>Giỏ hàng</h2>
    ${items.length===0?'<div class="empty-state"><div class="icon">🛒</div><p>Giỏ hàng trống. Vào cửa hàng để chọn mẫu.</p></div>':''}
    <div id="cartItems"></div>
    ${items.length>0?`<div class="cart-total"><div><div class="lbl">Tổng JPY</div><div style="font-size:14px;color:#9AA5BD;">${fmtJPY(totalJPY)}</div></div><div class="val">${fmtVND(totalVND)}</div></div><div style="display:flex;gap:10px;margin-top:12px;"><button class="btn-secondary" id="clearCart">Xoá giỏ</button><button class="btn-primary" id="checkoutBtn" style="flex:1;">Thanh toán & xem thông tin</button></div>`:''}
  </div>`;
  if(items.length>0){ document.getElementById('clearCart').addEventListener('click',()=>{ state.cart={}; updateCartBadge(); renderCart(); }); document.getElementById('checkoutBtn').addEventListener('click',()=>openCheckout(items,totalVND,totalJPY)); }
  const el=document.getElementById('cartItems'); if(!el) return;
  el.innerHTML=items.map(it=>{ const vnd=it.priceJPY!=null?it.priceJPY*state.settings.exchangeRate:null; return `<div class="cart-item"><img data-cthumb="${it.id}" alt=""><div class="ci-info"><div class="ci-code">${esc(it.code||'')}</div><div class="ci-name">${esc(it.name||'')}</div><div class="ci-price">${fmtVND(vnd)}</div></div><button class="ci-rm" data-rid="${it.id}">✕</button></div>`; }).join('');
  el.querySelectorAll('.ci-rm').forEach(btn=>{ btn.addEventListener('click',()=>{ delete state.cart[btn.dataset.rid]; updateCartBadge(); renderCart(); }); });
  lazyLoad('[data-cthumb]','cthumb');
}

function openCheckout(items,totalVND,totalJPY){
  const s=state.settings;
  const lines=items.map(it=>{ const v=it.priceJPY!=null?it.priceJPY*s.exchangeRate:null; return `• ${it.code||''} ${it.name||''}: ${fmtJPY(it.priceJPY)} (${fmtVND(v)})`; });
  const txt=`Đơn hàng ${items.length} mẫu:\n${lines.join('\n')}\n\nTỔNG JPY: ${fmtJPY(totalJPY)}\nTỔNG VND: ${fmtVND(totalVND)}\n(1 JPY = ${s.exchangeRate} VND)${s.bankAccountNumber?'\n\nCK: '+(s.bankAccountName||'')+' - '+s.bankAccountNumber+(s.bankName?' ('+s.bankName+')':''):''}`;
  mroot.innerHTML=`<div class="overlay" id="coO"><div class="sheet"><div class="sheet-head"><h3>Xác nhận đơn hàng</h3><button class="close-x" id="coX">✕</button></div><div class="sheet-body">
    ${items.map(it=>{ const v=it.priceJPY!=null?it.priceJPY*s.exchangeRate:null; return `<div class="checkout-line"><span>${esc(it.code||'')} ${esc(it.name||'')}</span><span>${fmtJPY(it.priceJPY)} · ${fmtVND(v)}</span></div>`; }).join('')}
    <div class="checkout-line total"><span>Tổng JPY</span><span>${fmtJPY(totalJPY)}</span></div>
    <div class="checkout-line total"><span>Tổng VND</span><span>${fmtVND(totalVND)}</span></div>
    <div style="font-size:12px;color:var(--ink-subtle);font-family:Arial,sans-serif;margin-top:4px;">Tỷ giá: 1 JPY = ${s.exchangeRate} VND</div>
    ${(s.bankQR||s.bankAccountNumber)?`<div class="bank-box">${s.bankQR?`<img src="${s.bankQR}">`:''}<div class="bname">${esc(s.bankAccountName||'')}</div><div class="bnum">${esc(s.bankAccountNumber||'')}</div><div class="bbank">${esc(s.bankName||'')}</div><button class="btn-secondary" id="copyAcc" style="margin-top:8px;width:100%;">Sao chép số tài khoản</button></div>`:''}
    <div class="sheet-actions"><button class="btn-secondary" id="copyOrder">Sao chép đơn hàng</button><button class="btn-primary" id="coDone">Xong</button></div>
  </div></div></div>`;
  document.getElementById('coO').addEventListener('click',e=>{ if(e.target.id==='coO') mroot.innerHTML=''; });
  document.getElementById('coX').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('coDone').addEventListener('click',()=>mroot.innerHTML='');
  document.getElementById('copyOrder').addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(txt); toast('Đã sao chép — dán vào Zalo gửi khách'); }catch(e){ toast('Không sao chép được'); } });
  const ca=document.getElementById('copyAcc'); if(ca) ca.addEventListener('click',async()=>{ try{ await navigator.clipboard.writeText(s.bankAccountNumber); toast('Đã sao chép số tài khoản'); }catch(e){ toast('Không sao chép được'); } });
}

// ═══ LAZY LOAD ═══
function lazyLoad(sel,key){
  const els=document.querySelectorAll(sel);
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(async entry=>{
      if(!entry.isIntersecting) return; obs.unobserve(entry.target);
      const id=entry.target.dataset[key];
      const item=await loadItem(id);
      if(!item||!item.images||!item.images[0]) return;
      const el=entry.target;
      if(el.tagName==='IMG'){ el.src=item.images[0]; }
      else { el.innerHTML=`<img src="${item.images[0]}" alt="" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;">${item.images.length>1?`<div class="img-count">1/${item.images.length}</div>`:''}`; }
    });
  },{rootMargin:'150px'});
  els.forEach(el=>obs.observe(el));
}

// ═══ INIT ═══
async function init(){
  // 1. Thử load từ GitHub (dữ liệu mới nhất, đồng bộ với mọi người)
  let ghData = null;
  try{ ghData = await ghLoad(); }catch(e){}

  if(ghData && ghData.index && ghData.index.length > 0){
    // Có dữ liệu GitHub -> dùng luôn
    state.index = ghData.index;
    if(ghData.settings) state.settings = {...state.settings, ...ghData.settings};
    // Cache items vào IndexedDB để truy cập nhanh
    if(ghData.items){
      for(const item of ghData.items){
        state.itemCache[item.id] = item;
        try{ await dbPut('items', item); }catch(e){}
      }
    }
    // Lưu index vào DB
    try{ await dbPut('meta',{key:'index', value:JSON.stringify(state.index)}); }catch(e){}
    try{ await dbPut('meta',{key:'settings', value:JSON.stringify(state.settings)}); }catch(e){}
  } else {
    // Không có GitHub data -> dùng IndexedDB/SEED
    try{ await Promise.all([loadSettings(), loadIndex()]); }
    catch(e){ console.error(e); }
    if(state.index.length === 0){
      state.index = SEED_INDEX;
      const s = JSON.parse(JSON.stringify(SEED_SETTINGS_DEFAULTS));
      state.settings = {...state.settings, ...s};
    }
  }

  state.loaded = true;
  render();
}
init();
</script>
